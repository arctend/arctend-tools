[project]
name = "arctend"
version = "0.1.1"
description = "Arctend adapter for forecasting-tools bots: a second question feed for Metaculus-template bots"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arctend Pty Ltd" }]
requires-python = ">=3.11,<3.14"
# Tested against forecasting-tools 0.3.5 (2026-11-05). The upper bound follows semantic
# versioning for 0.x (the minor version is the breaking one) and matches the template's own range.
dependencies = ["forecasting-tools>=0.3.5,<0.4"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
recovery = ["cryptography>=42"]

[project.urls]
Homepage = "https://api.arctend.com"
Repository = "https://github.com/arctend/arctend-tools"
Documentation = "https://api.arctend.com/docs/agents.md"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arctend"]

[tool.hatch.build.targets.sdist]
include = ["arctend", "examples", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
